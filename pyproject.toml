[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recoroi"
version = "1.0.0"
description = "Scientific Image Forgery Detection using Deep Learning"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "RecorAI Contributors", email = "contact@example.com"}
]
keywords = [
    "deep-learning",
    "image-segmentation",
    "forgery-detection",
    "scientific-images",
    "pytorch",
    "computer-vision",
    "kaggle-competition"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "segmentation-models-pytorch>=0.3.3",
    "timm>=0.9.0",
    "albumentations>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
experiment = [
    "wandb>=0.15.0",
    "tensorboard>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/EmreUludasdemir/RecorAI"
Documentation = "https://github.com/EmreUludasdemir/RecorAI/tree/main/docs"
Repository = "https://github.com/EmreUludasdemir/RecorAI"
Issues = "https://github.com/EmreUludasdemir/RecorAI/issues"
Changelog = "https://github.com/EmreUludasdemir/RecorAI/blob/main/CHANGELOG.md"

[project.scripts]
recoroi = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".git", "venv", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
